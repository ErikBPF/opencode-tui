[package]
name = "opencode-tui"
version = "0.0.1"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.89"
description = "Rust/ratatui client for the opencode server REST+SSE API"
publish = false

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots", "stream"] }
eventsource-stream = "0.2"
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
cucumber = "0.22"

# The contract binding runs Cucumber itself, so libtest must not wrap it.
[[test]]
name = "contract"
harness = false
